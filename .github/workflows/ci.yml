name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bbb
          POSTGRES_PASSWORD: bbb
          POSTGRES_DB: bbb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://bbb:bbb@localhost:5432/bbb

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm typecheck:e2e

      - run: pnpm --filter @bbb/api db:migrate

      - run: pnpm test

      - name: Browser tests (phone width)
        run: pnpm test:e2e
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-report
            e2e-results
