services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbb
      POSTGRES_PASSWORD: bbb
      POSTGRES_DB: bbb
    ports:
      - "5437:5432"
    volumes:
      - bbb_postgres_data:/var/lib/postgresql/data

volumes:
  bbb_postgres_data:
