<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bancroft Brew Bowl - set a password, with a problem</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same tokens as home.html. */
:root{
  --bg:#0e0e0f;--surface:#171718;--surface-2:#202022;--line:#2c2c2f;
  --accent:#c17a45;--accent-ink:#1a0f06;--accent-soft:rgba(193,122,69,.16);
  --text:#f4f4f2;--muted:#a3a3ab;--faint:#8b8b94;
  --alive:#4ade80;--r:14px
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:92px;min-height:100vh;-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.brand{text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:17px}
.brand b{display:block;font-size:16px;font-weight:600;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:8px 18px 14px}
.profile{margin:0 16px;display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.big{width:56px;height:56px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;font-weight:600;flex:none}
.profile b{display:block;font-size:17px;font-weight:600}
.profile span{display:block;font-size:14px;color:var(--muted);margin-top:2px;word-break:break-all}
h2{font-size:16px;font-weight:600;margin:28px 18px 12px}
.list{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-bottom:1px solid var(--line);font-size:15px}
.item:last-child{border-bottom:0}
.item .n{flex:1}
.item small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.item .go{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px}
.pill.alive{background:rgba(74,222,128,.1);color:var(--alive)}
.pill.out{background:var(--surface-2);color:var(--muted)}
.ico{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:none}
.card{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.field{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:400 16px Inter,sans-serif;padding:0 14px;display:flex;align-items:center}
.field.ph{color:var(--faint)}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 15px Inter,sans-serif;border:0;margin-top:14px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.sep{height:1px;background:var(--line);margin:20px 0}
.signout{margin:28px 16px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(14,14,15,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 14px}
nav a{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:44px;justify-content:center}
nav a.on{color:var(--accent)}
.mock{pointer-events:none;position:fixed;top:8px;right:8px;background:#fff;color:#000;font:10px sans-serif;padding:3px 6px;border-radius:4px;z-index:9}
.cta,.btn{text-decoration:none}a{-webkit-tap-highlight-color:transparent}
.mockidx{position:fixed;right:10px;bottom:76px;z-index:10;background:#2c2c2f;color:#f4f4f2;font:600 12px Inter,sans-serif;padding:9px 13px;border-radius:99px;text-decoration:none;border:1px solid #3d3d41;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pretend{margin:22px 16px 0;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--faint);line-height:1.5}.pretend a{color:var(--muted)}
.pretend{margin:22px 16px 0;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--faint);line-height:1.5}.pretend a{color:var(--muted)}

.pt{margin:8px 18px 4px;font-size:24px;font-weight:600;letter-spacing:-.01em}.ps{margin:0 18px 18px;font-size:14px;color:var(--muted);line-height:1.45}
.back2{display:inline-flex;align-items:center;gap:4px;margin:2px 14px 0;min-height:44px;padding:0 4px;color:var(--muted);font-size:14px;font-weight:500;text-decoration:none}
.fld{margin:0 16px 16px}.lbl{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:400 16px Inter,sans-serif;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.inp.ph{color:var(--faint)}.inp.bad{border-color:rgba(248,113,113,.7)}.inp .i{color:var(--faint)}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:#f87171;margin-top:6px}.msg .i{margin-top:1px;flex:none}
.hint2{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}
.ok{margin:30px 16px 0;text-align:center;padding:34px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.ok .badge{width:56px;height:56px;border-radius:16px;background:rgba(74,222,128,.1);color:var(--alive);display:grid;place-items:center;margin:0 auto 16px}
.ok h1{font-size:24px;font-weight:600}.ok p{font-size:15px;color:var(--muted);line-height:1.5;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;width:100%;margin:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 16px Inter,sans-serif;text-decoration:none;border:0}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Lucide icons (lucide-react 0.468.0, ISC licence), inlined for the static mockup -->
  <defs>
    <symbol id="chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="circle-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
    <symbol id="house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="utensils" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
  </defs>
</svg>
<div class="mock">MOCKUP</div>
<a class="mockidx" href="index.html">All mockups</a>
<header><a class="brand" href="home.html" aria-label="Brew Bowl home"><div class="logo">B</div><div><b>Brew Bowl</b><small>Bancroft Brewing Co.</small></div></a></header>
<a class="back2" href="account.html"><svg class="i sm"><use href="#chevron-left"/></svg>Me</a>
<h1 class="pt">Set a password</h1>
<p class="ps">Optional. You can always sign in with an email link instead.</p>
<div class="fld"><label class="lbl">New password</label><div class="inp">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull; <svg class="i"><use href="#eye"/></svg></div></div>
<div class="fld"><label class="lbl">Type it again</label><div class="inp bad">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull; <svg class="i"><use href="#eye"/></svg></div><p class="msg"><svg class="i sm"><use href="#circle-alert"/></svg>The two passwords don't match.</p></div>
<div class="fld" style="margin-top:22px"><a class="btn" href="password-saved.html">Save password</a></div>
<nav>
  <a href="home.html"><svg class="i"><use href="#house"/></svg>Home</a>
  <a href="pick.html"><svg class="i"><use href="#target"/></svg>Pick</a>
  <a href="standings.html"><svg class="i"><use href="#trophy"/></svg>Standings</a>
  <a href="menu-drinks.html"><svg class="i"><use href="#utensils"/></svg>Menu</a>
</nav>
<!-- role: admin tab -->
<script>(function(){
  var admin=false; try{var r=localStorage.getItem('bbbRole');admin=(r==='admin'||r==='all');}catch(e){}
  if(!admin) return;
  var nav=document.querySelector('nav'); if(!nav) return;
  if(nav.querySelector('a[href="admin.html"]')) return;
  if(nav.querySelectorAll('a').length!==4) return;
  if(location.pathname.split('/').pop()==='account.html'){ location.replace('account-admin.html'); return; }
  var a=document.createElement('a'); a.href='admin.html';
  a.innerHTML='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>Admin';
  nav.appendChild(a); nav.style.gridTemplateColumns='repeat(5,1fr)';
})();</script>
</body></html>
